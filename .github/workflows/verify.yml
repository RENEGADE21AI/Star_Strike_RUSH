name: Verify competition build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Syntax check browser and Function scripts
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find functions -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run all tests
        run: npm test
      - name: Verify Firestore authorization in the emulator
        run: npm run test:rules
      - name: Verify the real Firebase browser client against emulators
        run: npm run test:firebase-client
      - name: Run asserted visual QA
        run: npm run test:visual
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: test-artifacts/visual-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix functions --omit=dev --audit-level=high
      - name: Local tracked-file secret scan
        run: npm run test:secret
      - name: Production build
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: npm run build
      - name: Validate exact backend release marker
        run: |
          node scripts/generate-backend-release.js --sha "$GITHUB_SHA"
          node scripts/create-ci-release-report.js "$GITHUB_SHA" dist/version.json functions/release-identity.generated.js release-evidence/staged-release-report.json
      - name: Load Function module and validate Firebase config
        run: |
          node -e "require('./functions/index.js'); console.log('functions loaded')"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json')); JSON.parse(require('fs').readFileSync('firebase.json')); console.log('firebase json valid')"
      - name: Upload sanitized release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.run_id }}
          path: release-evidence/staged-release-report.json
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
